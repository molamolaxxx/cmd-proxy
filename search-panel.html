<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Panel</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 20px; color: #ccc; }

  .panel {
    background: #252540;
    border: 1px solid #3a3a5c;
    border-radius: 8px;
    max-width: 720px;
    overflow: hidden;
  }

  .panel-header {
    display: flex;
    align-items: center;
    padding: 10px 14px;
    cursor: pointer;
    user-select: none;
    gap: 8px;
    border-bottom: 1px solid #3a3a5c;
  }
  .panel-header:hover { background: #2e2e4a; }

  .arrow {
    display: inline-block;
    font-size: 12px;
    transition: transform 0.2s;
    color: #888;
  }
  .panel.collapsed .arrow { transform: rotate(-90deg); }

  .panel-header .icon { font-size: 14px; color: #7b8cde; }
  .panel-header .title { flex: 1; font-size: 13px; }
  .panel-header .title strong { color: #e0e0e0; }
  .panel-header .count { font-size: 12px; color: #888; }

  .panel-body {
    padding: 6px 0;
    max-height: 500px;
    overflow-y: auto;
    transition: max-height 0.3s ease;
  }
  .panel.collapsed .panel-body { max-height: 0; padding: 0; overflow: hidden; }

  .result-item {
    padding: 4px 16px 8px;
  }
  .result-item .meta {
    font-size: 11px;
    color: #777;
    margin-bottom: 1px;
  }
  .result-item .link {
    font-size: 13px;
    color: #7ecf8e;
    text-decoration: none;
    cursor: pointer;
  }
  .result-item .link:hover { text-decoration: underline; }
  .result-item .link.purple { color: #b39ddb; }
</style>
</head>
<body>

<div class="panel" id="panel">
  <div class="panel-header" onclick="toggle()">
    <span class="arrow">▼</span>
    <span class="icon">🌐</span>
    <span class="title">Web search: <strong>agentclientprotocol.com session stop RFD</strong></span>
    <span class="count">11 results</span>
  </div>
  <div class="panel-body" id="panelBody"></div>
</div>

<script>
const results = [
  { site: "agentclientprotocol.com", date: "2026年1月15日", title: "Session Config Options", visited: false },
  { site: "agentclientprotocol.com", date: "2025年11月24日", title: "Agent Client Protocol", visited: true },
  { site: "agentclientprotocol.com", date: "", title: "Agent Client Protocol", visited: true },
  { site: "agentclientprotocol.com", date: "", title: "Requests for Dialog (RFDs)", visited: false },
  { site: "agentclientprotocol.com", date: "2026年2月4日", title: "Agent Client Protocol", visited: true },
  { site: "agentclientprotocol.com", date: "2026年2月2日", title: "Agent Client Protocol", visited: true },
  { site: "agentclientprotocol.com", date: "2025年12月19日", title: "Session Usage and Context Status", visited: false },
  { site: "agentclientprotocol.com", date: "2025年12月9日", title: "Request Cancellation Mechanism", visited: false },
  { site: "agentclientprotocol.com", date: "2026年3月9日", title: "Authentication Methods", visited: false },
  { site: "agentclientprotocol.com", date: "2026年3月9日", title: "Closing active sessions", visited: false },
];

const body = document.getElementById("panelBody");
results.forEach(r => {
  const div = document.createElement("div");
  div.className = "result-item";
  div.innerHTML = `<div class="meta">${r.site}${r.date ? "  " + r.date : ""}</div>
    <a class="link ${r.visited ? "purple" : ""}" href="#">${r.title}</a>`;
  body.appendChild(div);
});

function toggle() {
  document.getElementById("panel").classList.toggle("collapsed");
}
</script>
</body>
</html>
